<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Rufin</title>
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="stylesheet" href="/static/css/style.css" />
		<link rel="stylesheet" href="/static/css/index.css" />
	</head>
	<body>
		{{ navbar }}
		<div id="title">
			<img src="/static/logo.svg" />
			<h1>Rufin</h1>
			<h3>
				Cross-platform music player for many libraries
				and music servers
			</h3>
		</div>
		<div id="links">
			<div class="links-row">
				<a class="button button-primary" href="/download">Download</a>
				<a class="button button-secondary" href="/docs">Docs</a>
			</div>
			<a
				class="button button-secondary button-small button-matrix"
				href="https://matrix.to/#/#rufin:rufin.app"
				target="_blank"
				rel="noopener noreferrer"
			>
				<!-- [m] mark, drawn with currentColor so it follows the text color -->
				<svg
					viewBox="0 0 24 24"
					aria-hidden="true"
					fill="none"
					stroke="currentColor"
					stroke-width="2"
				>
					<path d="M4 2H1.5v20H4" />
					<path d="M20 2h2.5v20H20" />
					<path
						d="M7 17V8.5M7 11c0-1.5 1-2.5 2.5-2.5S12 9.5 12 11v6M12 11c0-1.5 1-2.5 2.5-2.5S17 9.5 17 11v6"
						stroke-linecap="round"
					/>
				</svg>
				Matrix
			</a>
		</div>
		<div id="showcase">
			<img id="showcase-image" src="/static/Rufin_full.png" />
			<div id="showcase-text">
				<h3>Play your music with</h3>
				<div id="showcase-list">
					<h4>Local Library</h4>
					<h4>WebDAV / Nextcloud</h4>
					<h4>Samba</h4>
					<h4>Jellyfin</h4>
					<h4>Emby</h4>
					<h4>Navidrome</h4>
					<h4>OpenSubsonic</h4>
					<h4>Plex</h4>
				</div>
				<div id="showcase-services">
					<img src="/static/services/jellyfin.svg" alt="Jellyfin" title="Jellyfin" />
					<img src="/static/services/emby.svg" alt="Emby" title="Emby" />
					<img src="/static/services/navidrome.svg" alt="Navidrome" title="Navidrome" />
					<img src="/static/services/opensubsonic.svg" alt="OpenSubsonic" title="OpenSubsonic" />
					<img src="/static/services/plex.svg" alt="Plex" title="Plex" />
				</div>
			</div>
		</div>
	</body>
</html>
