<script>
    // Mobile menu: the hamburger button opens the links as a context menu
    (() => {
        const nav = document.currentScript.previousElementSibling;
        const toggle = nav.querySelector(".navbar-toggle");

        const setOpen = (open) => {
            nav.classList.toggle("navbar-open", open);
            toggle.setAttribute("aria-expanded", String(open));
            toggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
        };

        toggle.addEventListener("click", () => setOpen(!nav.classList.contains("navbar-open")));
        // Tapping anywhere outside the navbar closes the menu
        document.addEventListener("click", (e) => {
            if (nav.classList.contains("navbar-open") && !nav.contains(e.target)) setOpen(false);
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape" && nav.classList.contains("navbar-open")) {
                setOpen(false);
                toggle.focus();
            }
        });
        // Close it if the screen gets wide enough to show the normal navbar
        matchMedia("(min-width: 701px)").addEventListener("change", (e) => e.matches && setOpen(false));
    })();
</script>
